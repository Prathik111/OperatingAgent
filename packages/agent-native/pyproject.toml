[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-native"
version = "0.0.0"
description = "Agent native package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"requests",
	"python-dotenv"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["agent_native"]

[tool.setuptools.package-data]
"agent_native" = ["py.typed"]
