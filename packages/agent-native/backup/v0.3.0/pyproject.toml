[project]
name = "agent-native"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amisharun412", email = "anisharunsamy12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "file-server",
    "asyncpg>=0.31.0",
    "groq",
    "python-dotenv",
]

[tool.uv.sources]
file-server = { workspace = true }

[project.optional-dependencies]
ollama = ["ollama>=0.5.0"]
tracing = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]

[project.scripts]
agent-native = "agent_native.main:main"
agent-native-harness = "agent_native.harness:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
