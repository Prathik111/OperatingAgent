[project]
name = "observability"
version = "0.1.0"
description = "Shared Langfuse tracing/observability for OperatingAgent"
readme = "README.md"
authors = [
    { name = "anisharun412", email = "anisharunsamy12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "common",
    "langfuse>=4.14.4",
    "langchain>=1.0",
]

[project.scripts]
observability = "observability:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
common = { workspace = true }
